# Every push to main and every pull request: the tests on Linux, Windows and
# macOS, the app driven on each (the smoke test; on Linux and Windows the
# packaged app's too, and on Windows the pointer's) - each of those gating,
# with one retry that leaves a warning, so a push is never known good only
# on the machine it came from.
# A version tag (v1.2.3) does all that and the release: the engine built, a
# MinGW-w64 fetched from winlibs and cut down, PyInstaller's folder made
# and zipped by package.py, the zip attached to a DRAFT release for the
# tag - with the Linux build beside it (PyInstaller's folder as a tarball,
# made and driven on every push too). Publish it by hand; the app's update
# check reads the newest published release. The tag must match
# native/version.py's __version__.
# The unit tests run on Linux too (issue #9): a crash only Linux has (the
# engine's unload, issue #3) cannot show on Windows - the draft waits on both.
name: release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# a newer push to a branch makes the run for the older one moot; a tag's run always finishes
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: write

env:
  WINLIBS_URL: https://github.com/brechtsanders/winlibs_mingw/releases/download/16.2.0posix-14.0.0-ucrt-r1/winlibs-x86_64-posix-seh-gcc-16.2.0-mingw-w64ucrt-14.0.0-r1.zip

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # PortAudio for sounddevice, ALSA and JACK headers for python-rtmidi's build, a virtual display and
      # the GL and X libraries Dear PyGui opens its window with
      - name: the system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y libportaudio2 libasound2-dev libjack-jackd2-dev xvfb libgl1 libegl1 \
            libx11-6 libxrandr2 libxinerama1 libxcursor1 libxi6 ffmpeg

      - name: the packages
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: the engine
        run: python build.py --native-only

      # no display needed: every tests/test_*.py - the engine swapped (issue #3), the scratch folder's
      # permissions (GHSA-h8r2-jh8g-f2xh), the graph compiler, the shapes, every device path against the fake WLED
      - name: the tests
        env:
          STUDIO_NO_UPDATE_CHECK: "1"
          STUDIO_NO_WELCOME: "1"
        run: |
          for t in tests/test_*.py; do
            echo "== $t"
            python "$t" || exit 1
          done

      # the app itself, under a virtual display (the runner's GL is enough for Dear PyGui); a second run
      # when the first fails, with a warning - a failure twice fails the job
      - name: the app, under a virtual display
        timeout-minutes: 25
        env:
          STUDIO_NO_UPDATE_CHECK: "1"
          STUDIO_NO_WELCOME: "1"
        run: |
          xvfb-run -a -s "-screen 0 1600x1000x24" python tests/smoke_app.py && exit 0
          echo "::warning::the smoke test failed once on Linux; running it again"
          xvfb-run -a -s "-screen 0 1600x1000x24" python tests/smoke_app.py

      # the release's Linux build: PyInstaller's folder as a tarball (no compiler inside - the system's gcc
      # or clang builds the effects), and the app driven again from it, gating like the tree's
      - name: the release folder and tarball
        run: |
          python -m pip install pyinstaller
          python package.py --zip

      - name: the app, packaged, under a virtual display
        timeout-minutes: 25
        env:
          STUDIO_NO_UPDATE_CHECK: "1"
          STUDIO_NO_WELCOME: "1"
        run: |
          mkdir -p packaged && tar -xzf dist/WLED_Effects_Studio_linux.tar.gz -C packaged
          export STUDIO_EXE="$PWD/packaged/WLED Effects Studio/WLED Effects Studio (console)"
          xvfb-run -a -s "-screen 0 1600x1000x24" python tests/smoke_app.py && exit 0
          echo "::warning::the smoke test failed once against the packaged app on Linux; running it again"
          xvfb-run -a -s "-screen 0 1600x1000x24" python tests/smoke_app.py

      - uses: actions/upload-artifact@v4
        with:
          name: WLED_Effects_Studio_linux
          path: dist/WLED_Effects_Studio_linux.tar.gz

  # the roadmap's Linux / macOS pass, macOS half: the engine built with Apple's clang, every unit test, the app
  # driven by the smoke test (the runner's screen is 1280 x 646). Gating since it ran green (1.4.0); no macOS
  # build is released - macOS runs from a checkout
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # ffmpeg for the video and camera-map tests; sounddevice's wheel carries its own PortAudio
      - name: the system packages
        run: brew install ffmpeg || true

      - name: the packages
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: the engine
        run: python build.py --native-only

      - name: the tests
        env:
          STUDIO_NO_UPDATE_CHECK: "1"
          STUDIO_NO_WELCOME: "1"
        run: |
          for t in tests/test_*.py; do
            echo "== $t"
            python "$t" || exit 1
          done

      - name: the app
        timeout-minutes: 20
        env:
          STUDIO_NO_UPDATE_CHECK: "1"
          STUDIO_NO_WELCOME: "1"
        run: |
          python tests/smoke_app.py && exit 0
          echo "::warning::the smoke test failed once on macOS; running it again"
          python tests/smoke_app.py

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: the packages
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: the version tag matches native/version.py
        shell: python
        run: |
          import os, re, sys
          v = re.search(r'__version__\s*=\s*"([^"]+)"', open("native/version.py").read()).group(1)
          ref = os.environ.get("GITHUB_REF_NAME", "")
          if ref.startswith("v") and ref[1:] != v:
              sys.exit(f"the tag {ref} does not match version {v}")
          print("version", v)

      - name: MinGW-w64 from winlibs
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri $env:WINLIBS_URL -OutFile winlibs.zip
          Expand-Archive winlibs.zip -DestinationPath mingw
          Get-ChildItem mingw

      # the engine is built with the same compiler the release ships (no
      # MSVC on the runner is needed then), and the objects go into the zip
      - name: the release folder and zip
        shell: pwsh
        run: |
          $env:STUDIO_TOOLCHAIN = "$PWD\mingw\mingw64"
          python package.py --toolchain "$PWD\mingw\mingw64" --zip

      # no display needed: every tests\test_*.py - the graph compiler, the shapes, every device path against the fake WLED
      - name: the tests
        shell: pwsh
        run: |
          $env:STUDIO_TOOLCHAIN = "$PWD\mingw\mingw64"
          $env:STUDIO_NO_UPDATE_CHECK = "1"
          $env:STUDIO_NO_WELCOME = "1"
          foreach ($t in Get-ChildItem tests\test_*.py) {
            Write-Host "== $($t.Name)"
            python $t.FullName
            if ($LASTEXITCODE) { exit 1 }
          }

      - name: the tests, against the packaged app
        timeout-minutes: 30
        shell: pwsh
        run: |
          Expand-Archive dist\WLED_Effects_Studio.zip -DestinationPath packaged
          $env:STUDIO_EXE = "$PWD\packaged\WLED Effects Studio\WLED Effects Studio (console).exe"
          $env:STUDIO_NO_UPDATE_CHECK = "1"
          $env:STUDIO_NO_WELCOME = "1"
          # a user's machine: no git, no MSVC, no emsdk on the path - the bundled toolchain has to do
          $py = (Get-Command python).Source
          $env:PATH = "C:\Windows\System32;C:\Windows;C:\Windows\System32\Wbem"
          # the runner has a desktop Dear PyGui opens its window on; a second run when the first fails
          & $py tests\smoke_app.py
          if ($LASTEXITCODE) {
            Write-Host "::warning::the smoke test failed once against the packaged app; running it again"
            & $py tests\smoke_app.py
            if ($LASTEXITCODE) { exit 1 }
          }

      # the graph view with a mouse: hover, focus, clicks on what floats over the canvas (posted to its window)
      - name: the pointer, against the tree's app
        timeout-minutes: 15
        shell: pwsh
        run: |
          $env:STUDIO_TOOLCHAIN = "$PWD\mingw\mingw64"
          $env:STUDIO_NO_UPDATE_CHECK = "1"
          $env:STUDIO_NO_WELCOME = "1"
          python tests\pointer_app.py
          if ($LASTEXITCODE) {
            Write-Host "::warning::the pointer test failed once; running it again"
            python tests\pointer_app.py
            if ($LASTEXITCODE) { exit 1 }
          }

      - uses: actions/upload-artifact@v4
        with:
          name: WLED_Effects_Studio
          path: dist/WLED_Effects_Studio.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: WLED_Effects_Studio
          path: dist

      - uses: actions/download-artifact@v4
        with:
          name: WLED_Effects_Studio_linux
          path: dist

      # both builds on the draft: the app's update check takes its own platform's (native/update.py asset_for)
      - name: the draft release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            dist/WLED_Effects_Studio.zip
            dist/WLED_Effects_Studio_linux.tar.gz
          generate_release_notes: true
