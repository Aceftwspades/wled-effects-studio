# Publishes the browser simulator (index.html + the wasm engine) to GitHub
# Pages on every push to main. The wasm is a build product (not committed), so
# it is built here with emsdk. One-time setup: repo Settings > Pages > Source:
# "GitHub Actions".
name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: mymindstorm/setup-emsdk@v14
      - name: Build the wasm engine
        run: python build.py --wasm-only
      - name: Assemble the site
        run: |
          mkdir _site
          cp index.html cubefx.js cubefx.wasm _site/
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
